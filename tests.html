<!doctype html><meta charset="utf-8"><title>Família Radis — tests</title><pre id="out"></pre><script type="module">import {people,relations,personById,validateData,EVIDENCE} from './family-data.js';import {buildLayout} from './layout.js';const out=[];const t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const ok=(x,m='assertion failed')=>{if(!x)throw Error(m)};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>personById(r.to));const partners=(a,b)=>relations.some(r=>r.type==='partner'&&((r.from===a&&r.to===b)||(r.from===b&&r.to===a)));t('dados genealógicos são válidos',()=>ok(validateData().length===0,validateData().join('; ')));t('todos têm estado de evidência válido',()=>ok(people.every(p=>EVIDENCE.includes(p.evidenceStatus))));t('Arlinda e Manoel formam o casal confirmado',()=>ok(partners('arlinda','manoel')));t('Terezinha é filha de Arlinda e Manoel',()=>{ok(children('arlinda').some(p=>p.id==='terezinha'));ok(children('manoel').some(p=>p.id==='terezinha'))});t('layout posiciona todas as pessoas',()=>{const p=buildLayout(people,relations);ok(people.every(x=>Array.isArray(p[x.id])))});t('pais ficam acima dos filhos',()=>{const p=buildLayout(people,relations);relations.filter(r=>r.type==='parent').forEach(r=>ok(p[r.from][1]<p[r.to][1],r.from+' deve ficar acima de '+r.to))});t('casais ficam na mesma geração visual',()=>{const p=buildLayout(people,relations);relations.filter(r=>r.type==='partner').forEach(r=>ok(p[r.from][1]===p[r.to][1]))});t('Joyce aparece abaixo de ambos os pais',()=>{const p=buildLayout(people,relations);ok(p.elielton[1]<p.joyce[1]&&p.ritheli[1]<p.joyce[1])});t('apenas conexões antigas realmente incertas seguem a investigar',()=>['pedro','carlos','maria'].forEach(id=>ok(personById(id).evidenceStatus==='investigate')));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x.startsWith('✗')))throw Error('tests failed');</script>
