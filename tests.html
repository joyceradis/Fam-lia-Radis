<!doctype html><meta charset="utf-8"><title>Família Radis — auditoria</title><pre id="out"></pre><script type="module">import{people,relations,personById,validateData,EVIDENCE}from'./family-data.js';const out=[],ok=(x,m='falhou')=>{if(!x)throw Error(m)},t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>r.to),partner=(a,b)=>relations.find(r=>r.type==='partner'&&[r.from,r.to].includes(a)&&[r.from,r.to].includes(b));t('dataset válido',()=>ok(!validateData().length,validateData().join('; ')));t('15 pessoas no baseline auditado',()=>ok(people.length===15));t('América e Arlinda são irmãs',()=>ok(relations.some(r=>r.type==='sibling'&&[r.from,r.to].includes('america')&&[r.from,r.to].includes('arlinda'))));t('Zeli é filha de América',()=>ok(children('america').includes('zeli')));t('Terezinha é filha de Arlinda',()=>ok(children('arlinda').includes('terezinha')));t('Sheila e Ritheli são filhas de Terezinha',()=>ok(['sheila','ritheli'].every(x=>children('terezinha').includes(x))));t('Elielton e Elenilton são filhos de Zeli',()=>ok(['elielton','elenilton'].every(x=>children('zeli').includes(x))));t('Sheila + Elenilton',()=>ok(partner('sheila','elenilton')));t('Ritheli + Elielton com consanguinidade registrada',()=>ok(partner('ritheli','elielton')?.consanguineous===true));t('Joyce, Estevão e Arthur são filhos do mesmo casal',()=>['joyce','estevao','arthur'].forEach(x=>{ok(children('ritheli').includes(x));ok(children('elielton').includes(x))}));t('ancestrais incertos continuam sem filiação inventada',()=>['manoel','pedro','carlos','maria'].forEach(id=>{ok(personById(id).evidenceStatus==='investigate');ok(!relations.some(r=>r.type==='parent'&&(r.from===id||r.to===id))) }));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x[0]==='✗'))throw Error('auditoria falhou');</script>
