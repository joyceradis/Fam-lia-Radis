<!doctype html><meta charset="utf-8"><title>Família Radis — tests</title><pre id="out"></pre><script type="module">import {people,relations,childrenOf,personById,validateData} from './family-data.js'; const out=[]; const t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}}; const ok=(x,m='assertion failed')=>{if(!x)throw Error(m)}; t('dados genealógicos são válidos',()=>ok(validateData().length===0,validateData().join('; '))); t('Zeli é filha de América',()=>ok(childrenOf('america').some(p=>p.id==='zeli'))); t('Arlinda é irmã de América',()=>ok(personById('arlinda')&&personById('america'))); t('Terezinha é filha de Arlinda',()=>ok(childrenOf('arlinda').some(p=>p.id==='terezinha'))); t('Sheila e Ritheli são filhas de Terezinha',()=>{const ids=childrenOf('terezinha').map(p=>p.id);ok(ids.includes('sheila')&&ids.includes('ritheli'))}); t('Elielton e Elenilton são filhos de Zeli',()=>{const ids=childrenOf('zeli').map(p=>p.id);ok(ids.includes('elielton')&&ids.includes('elenilton'))}); document.querySelector('#out').textContent=out.join('\n'); if(out.some(x=>x.startsWith('✗'))) throw Error('tests failed');</script>
