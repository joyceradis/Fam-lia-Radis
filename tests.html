<!doctype html><meta charset="utf-8"><title>Família Radis — tests</title><pre id="out"></pre><script type="module">import {people,relations,personById,validateData,EVIDENCE} from './family-data.js';const out=[];const t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const ok=(x,m='assertion failed')=>{if(!x)throw Error(m)};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>personById(r.to));t('dados genealógicos são válidos',()=>ok(validateData().length===0,validateData().join('; ')));t('todos têm estado de evidência válido',()=>ok(people.every(p=>EVIDENCE.includes(p.evidenceStatus))));t('Zeli é filha de América',()=>ok(children('america').some(p=>p.id==='zeli')));t('Terezinha é filha de Arlinda',()=>ok(children('arlinda').some(p=>p.id==='terezinha')));t('Sheila e Ritheli são filhas de Terezinha',()=>{const ids=children('terezinha').map(p=>p.id);ok(ids.includes('sheila')&&ids.includes('ritheli'))});t('Elielton e Elenilton são filhos de Zeli',()=>{const ids=children('zeli').map(p=>p.id);ok(ids.includes('elielton')&&ids.includes('elenilton'))});t('ancestrais incertos permanecem a investigar',()=>['manoel','pedro','carlos','maria'].forEach(id=>ok(personById(id).evidenceStatus==='investigate')));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x.startsWith('✗')))throw Error('tests failed');</script>
