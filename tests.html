<!doctype html><meta charset="utf-8"><title>Família Radis — auditoria</title><style>body{background:#071a1d;color:#eee;font:15px system-ui;padding:30px;line-height:1.7}</style><pre id="out"></pre><script type="module">import{people,relations,personById,validateData}from'./family-data.js';const out=[],ok=(x,m='falhou')=>{if(!x)throw Error(m)},t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>r.to),partner=(a,b)=>relations.find(r=>r.type==='partner'&&[r.from,r.to].includes(a)&&[r.from,r.to].includes(b)),siblings=(a,b)=>relations.some(r=>r.type==='sibling'&&[r.from,r.to].includes(a)&&[r.from,r.to].includes(b));t('dataset válido',()=>ok(!validateData().length,validateData().join('; ')));t('26 pessoas na âncora atual',()=>ok(people.length===26,`há ${people.length}`));t('Merca + Pedro',()=>ok(partner('america','pedro')));t('Arlinda + Manoel',()=>ok(partner('arlinda','manoel-avo')));t('Merca e Arlinda são irmãs',()=>ok(siblings('america','arlinda')));t('Pedro e Manoel são irmãos',()=>ok(siblings('pedro','manoel-avo')));t('quatro ancestrais marcados falecidos',()=>['america','arlinda','pedro','manoel-avo'].forEach(id=>ok(personById(id)?.deceased,id)));t('Zeli é filha de Merca + Pedro',()=>['america','pedro'].forEach(id=>ok(children(id).includes('zeli'))));t('Terezinha é filha de Arlinda + Manoel',()=>['arlinda','manoel-avo'].forEach(id=>ok(children(id).includes('terezinha'))));t('Zeli + Sebastião: quatro filhos',()=>{ok(partner('zeli','sebastiao'));['elielton','elenilton','elenice','welington'].forEach(x=>{ok(children('zeli').includes(x));ok(children('sebastiao').includes(x))})});t('Terezinha + José: Ritheli e Sheila',()=>{ok(partner('terezinha','jose'));ok(personById('jose')?.deceased);['ritheli','sheila'].forEach(x=>{ok(children('terezinha').includes(x));ok(children('jose').includes(x))})});t('Terezinha + Brás: Brazin, Fabiana e Renata',()=>{ok(partner('terezinha','bras'));['brazin','fabiana','renata'].forEach(x=>{ok(children('terezinha').includes(x));ok(children('bras').includes(x))})});t('Ritheli + Elielton: Joyce, Estevão e Arthur',()=>{ok(partner('ritheli','elielton'));['joyce','estevao','arthur'].forEach(x=>{ok(children('ritheli').includes(x));ok(children('elielton').includes(x))})});t('Sheila + Elenilton: Gabi e Samuel',()=>{ok(partner('sheila','elenilton'));['gabi','samuel'].forEach(x=>{ok(children('sheila').includes(x));ok(children('elenilton').includes(x))})});t('não existe consanguinidade gráfica presumida',()=>ok(!relations.some(r=>r.consanguineous)));t('Carlos e Maria continuam sem filiação inventada',()=>['carlos','maria'].forEach(id=>{ok(personById(id)?.evidenceStatus==='investigate');ok(!relations.some(r=>r.type==='parent'&&(r.from===id||r.to===id)))}));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x.startsWith('✗')))document.body.dataset.failed='true';</script>
