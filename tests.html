<!doctype html><meta charset="utf-8"><title>Família Radis — auditoria</title><style>body{background:#071a1d;color:#eee;font:15px system-ui;padding:30px;line-height:1.7}</style><pre id="out"></pre><script type="module">import{people,relations,personById,validateData}from'./family-data.js';const out=[],ok=(x,m='falhou')=>{if(!x)throw Error(m)},t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>r.to),partner=(a,b)=>relations.find(r=>r.type==='partner'&&[r.from,r.to].includes(a)&&[r.from,r.to].includes(b));t('dataset válido',()=>ok(!validateData().length,validateData().join('; ')));t('16 pessoas no baseline auditado',()=>ok(people.length===16,`há ${people.length}`));t('Vô Manoel e Tio Manoel são pessoas distintas',()=>{ok(personById('manoel-avo'));ok(personById('manoel-tio'));ok(personById('manoel-avo')!==personById('manoel-tio'))});t('América e Arlinda são irmãs',()=>ok(relations.some(r=>r.type==='sibling'&&[r.from,r.to].includes('america')&&[r.from,r.to].includes('arlinda'))));t('Zeli é filha de América',()=>ok(children('america').includes('zeli')));t('Terezinha é filha de Arlinda + Vô Manoel',()=>{ok(children('arlinda').includes('terezinha'));ok(children('manoel-avo').includes('terezinha'))});t('Tio Manoel é filho de Arlinda + Vô Manoel',()=>{ok(children('arlinda').includes('manoel-tio'));ok(children('manoel-avo').includes('manoel-tio'))});t('Sheila e Ritheli são filhas de Terezinha',()=>ok(['sheila','ritheli'].every(x=>children('terezinha').includes(x))));t('Elielton e Elenilton são filhos de Zeli',()=>ok(['elielton','elenilton'].every(x=>children('zeli').includes(x))));t('Sheila + Elenilton',()=>ok(partner('sheila','elenilton')));t('Ritheli + Elielton com consanguinidade registrada',()=>ok(partner('ritheli','elielton')?.consanguineous===true));t('Joyce, Estevão e Arthur são filhos do mesmo casal',()=>['joyce','estevao','arthur'].forEach(x=>{ok(children('ritheli').includes(x));ok(children('elielton').includes(x))}));t('Pedro, Carlos e Maria seguem sem filiação inventada',()=>['pedro','carlos','maria'].forEach(id=>{ok(personById(id)?.evidenceStatus==='investigate');ok(!relations.some(r=>r.type==='parent'&&(r.from===id||r.to===id))) }));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x.startsWith('✗')))document.body.dataset.failed='true';</script>
