<!doctype html><meta charset="utf-8"><title>Família Radis — tests</title><pre id="out"></pre><script type="module">import {people,relations,personById,validateData,EVIDENCE} from './family-data.js';import {buildLayout} from './layout.js';const out=[];const t=(n,f)=>{try{f();out.push('✓ '+n)}catch(e){out.push('✗ '+n+' — '+e.message)}};const ok=(x,m='assertion failed')=>{if(!x)throw Error(m)};const children=id=>relations.filter(r=>r.type==='parent'&&r.from===id).map(r=>personById(r.to));const partners=(a,b)=>relations.some(r=>r.type==='partner'&&((r.from===a&&r.to===b)||(r.from===b&&r.to===a)));t('dados genealógicos são válidos',()=>ok(validateData().length===0,validateData().join('; ')));t('todos têm estado de evidência válido',()=>ok(people.every(p=>EVIDENCE.includes(p.evidenceStatus))));t('Zeli é filha de América',()=>ok(children('america').some(p=>p.id==='zeli')));t('Terezinha é filha de Arlinda',()=>ok(children('arlinda').some(p=>p.id==='terezinha')));t('Sheila e Ritheli são filhas de Terezinha',()=>{const ids=children('terezinha').map(p=>p.id);ok(ids.includes('sheila')&&ids.includes('ritheli'))});t('Elielton e Elenilton são filhos de Zeli',()=>{const ids=children('zeli').map(p=>p.id);ok(ids.includes('elielton')&&ids.includes('elenilton'))});t('Sheila e Elenilton formam casal',()=>ok(partners('sheila','elenilton')));t('Joyce é filha de Ritheli e Elielton',()=>{ok(children('ritheli').some(p=>p.id==='joyce'));ok(children('elielton').some(p=>p.id==='joyce'))});t('layout preserva duas linhagens paralelas',()=>{const p=buildLayout(people,relations);ok(p.america[0]<p.arlinda[0],'América deve ficar à esquerda de Arlinda');ok(p.zeli[0]<p.terezinha[0],'ramo de Zeli deve ficar à esquerda do ramo de Terezinha')});t('casal Sheila + Elenilton fica junto e acima de Joyce',()=>{const p=buildLayout(people,relations);ok(Math.abs(p.sheila[0]-p.elenilton[0])<190,'casal deve ficar próximo');ok(p.sheila[1]===p.elenilton[1]);ok(p.sheila[1]<p.joyce[1])});t('ancestrais incertos ficam isolados até confirmação',()=>['manoel','pedro','carlos','maria'].forEach(id=>ok(personById(id).evidenceStatus==='investigate'&&!relations.some(r=>r.type==='parent'&&(r.from===id||r.to===id)))));document.querySelector('#out').textContent=out.join('\n');if(out.some(x=>x.startsWith('✗')))throw Error('tests failed');</script>
